<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICE Calculator</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --surface: #131316;
            --surface-raised: #1a1a1e;
            --border: #262629;
            --border-soft: #1f1f22;
            --text-primary: #f2f2f3;
            --text-secondary: #8c8c93;
            --text-tertiary: #616166;
            --accent: #f2c94c;
            --accent-soft: rgba(242, 201, 76, 0.18);
            --impact: #eb5757;
            --confidence: #f2994a;
            --ease: #4cb782;
            --total: #f2c94c;
            --radius: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scorePulse {
            0% { transform: scale(1); }
            35% { transform: scale(1.16); }
            100% { transform: scale(1); }
        }

        @keyframes cardFlash {
            0% { box-shadow: 0 0 0 0 var(--accent-soft); }
            35% { box-shadow: 0 0 0 5px var(--accent-soft); }
            100% { box-shadow: 0 0 0 0 rgba(94, 106, 210, 0); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .header {
            padding: 32px 30px;
            border-bottom: 1px solid var(--border);
            animation: fadeInUp 0.5s ease both;
        }

        .header h1 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .header h1 .mark {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            background: linear-gradient(135deg, #ffe08a 0%, var(--accent) 100%);
            flex-shrink: 0;
        }

        .header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .score-display {
            display: flex;
            justify-content: space-around;
            gap: 16px;
            padding: 24px 30px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .score-card {
            flex: 1;
            text-align: center;
            padding: 18px;
            background: var(--surface-raised);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            min-width: 120px;
            transition: border-color 0.2s ease, transform 0.2s ease;
            animation: fadeInUp 0.5s ease both;
        }

        .score-card:nth-child(1) { animation-delay: 0.05s; }
        .score-card:nth-child(2) { animation-delay: 0.1s; }
        .score-card:nth-child(3) { animation-delay: 0.15s; }
        .score-card:nth-child(4) { animation-delay: 0.2s; }

        .score-card:hover {
            border-color: var(--border);
            transform: translateY(-2px);
        }

        .score-card.flash {
            animation: cardFlash 0.6s ease;
        }

        .score-card h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-secondary);
        }

        .score-value {
            display: inline-block;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .score-value.pulse {
            animation: scorePulse 0.45s ease;
        }

        .score-card .unit {
            font-size: 0.8rem;
            color: var(--text-tertiary);
        }

        .impact .score-value { color: var(--impact); }
        .confidence .score-value { color: var(--confidence); }
        .ease .score-value { color: var(--ease); }
        .total .score-value { color: var(--total); }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0;
        }

        .section {
            padding: 28px 30px;
            border-right: 1px solid var(--border);
            animation: fadeInUp 0.5s ease both;
        }

        .section:nth-child(1) { animation-delay: 0.15s; }
        .section:nth-child(2) { animation-delay: 0.25s; }
        .section:nth-child(3) { animation-delay: 0.35s; }

        .section:last-child {
            border-right: none;
        }

        .section h2 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .section h2::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .impact h2 { color: var(--impact); }
        .confidence h2 { color: var(--confidence); }
        .ease h2 { color: var(--ease); }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 0.87rem;
        }

        .category-label {
            color: var(--text-tertiary);
            font-size: 0.78rem;
            font-weight: 400;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            background: var(--surface-raised);
            color: var(--text-primary);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        select:hover {
            border-color: #3a3a3f;
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        select option {
            background: var(--surface-raised);
            color: var(--text-primary);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-weight: 400;
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .section {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .section:last-child {
                border-bottom: none;
            }

            .score-display {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span class="mark"></span>ICE Calculator</h1>
            <p>Impact × Confidence × Ease Framework</p>
        </div>

        <div class="score-display">
            <div class="score-card impact">
                <h3>Impact</h3>
                <div class="score-value" id="impactScore">0</div>
                <div class="unit">/ 5</div>
            </div>
            <div class="score-card confidence">
                <h3>Confidence</h3>
                <div class="score-value" id="confidenceScore">0</div>
                <div class="unit">/ 5</div>
            </div>
            <div class="score-card ease">
                <h3>Ease</h3>
                <div class="score-value" id="easeScore">5</div>
                <div class="unit">/ 5</div>
            </div>
            <div class="score-card total">
                <h3>Total Score</h3>
                <div class="score-value" id="totalScore">0</div>
            </div>
        </div>

        <div class="main-content">
            <!-- Impact Section -->
            <div class="section impact">
                <h2>Impact</h2>

                <div class="form-group">
                    <label><span class="category-label">[New business]</span> Win rate increase potential</label>
                    <select id="winRate" onchange="calculateScores()">
                        <option value="0">Select...</option>
                        <option value="0.1">Low</option>
                        <option value="0.5">Medium</option>
                        <option value="1">High</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><span class="category-label">[New business]</span> ARR increase potential</label>
                    <select id="arrPotential" onchange="calculateScores()">
                        <option value="0">Select...</option>
                        <option value="0.2">&lt;100K</option>
                        <option value="0.5">100–249K</option>
                        <option value="1">250–499K</option>
                        <option value="2">500–999K</option>
                        <option value="3">&gt;1M</option>
                        <option value="0">Unknown / None</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><span class="category-label">[Existing business]</span> Retention / LTV increase potential</label>
                    <select id="retentionLtv" onchange="calculateScores()">
                        <option value="0">Select...</option>
                        <option value="0.1">Low</option>
                        <option value="0.5">Medium</option>
                        <option value="1">High</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><span class="category-label">[Existing business]</span> Customer satisfaction / NPS improvement potential</label>
                    <select id="customerSat" onchange="calculateScores()">
                        <option value="0">Select...</option>
                        <option value="0.01">Low</option>
                        <option value="0.1">Medium</option>
                        <option value="0.5">High</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>User base reach</label>
                    <select id="userBaseReach" onchange="calculateScores()">
                        <option value="0">Select...</option>
                        <option value="0.2">&lt;10%</option>
                        <option value="0.5">10–25%</option>
                        <option value="0.75">25–50%</option>
                        <option value="1">50–100%</option>
                    </select>
                </div>
            </div>

            <!-- Confidence Section -->
            <div class="section confidence">
                <h2>Confidence</h2>

                <div class="form-group">
                    <label>Canny votes</label>
                    <select id="cannyVotes" onchange="calculateScores()">
                        <option value="0">Select...</option>
                        <option value="0.1">&lt;5</option>
                        <option value="0.25">5–10</option>
                        <option value="0.5">11–49</option>
                        <option value="0.75">50–75</option>
                        <option value="1">&gt;75</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Competitive landscape</label>
                    <select id="competitive" onchange="calculateScores()">
                        <option value="0">Select...</option>
                        <option value="0.5">Playing catch-up, everyone has it / Low-risk bet</option>
                        <option value="0.1">Some competitors have it / Medium-risk bet</option>
                        <option value="0">No competitive alignment / High-risk bet</option>
                    </select>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="userResearch" onchange="calculateScores()">
                        <label for="userResearch">Confirmed by user research</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="analytics" onchange="calculateScores()">
                        <label for="analytics">Supported by product analytics</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="differentiator" onchange="calculateScores()">
                        <label for="differentiator">Differentiator potential</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="marketTrends" onchange="calculateScores()">
                        <label for="marketTrends">Supported by market trends</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="icpSegment" onchange="calculateScores()">
                        <label for="icpSegment">ICP segment fit</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="icpMarket" onchange="calculateScores()">
                        <label for="icpMarket">ICP market fit</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="churnedDeals" onchange="calculateScores()">
                        <label for="churnedDeals">Supported by churned / lost deals</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="supportWorkload" onchange="calculateScores()">
                        <label for="supportWorkload">Generates Support workload</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="techPerspective" onchange="calculateScores()">
                        <label for="techPerspective">Desirable from the tech perspective</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="selfConviction" onchange="calculateScores()">
                        <label for="selfConviction">Self conviction</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="managerConviction" onchange="calculateScores()">
                        <label for="managerConviction">Your manager's conviction</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="externalFactors" onchange="calculateScores()">
                        <label for="externalFactors">External factors</label>
                    </div>
                </div>
            </div>

            <!-- Ease Section -->
            <div class="section ease">
                <h2>Ease</h2>

                <div class="form-group">
                    <label>Implementation complexity</label>
                    <select id="complexity" onchange="calculateScores()">
                        <option value="0">Select...</option>
                        <option value="0">Low</option>
                        <option value="-1">Medium</option>
                        <option value="-2">High</option>
                        <option value="-3">Unknown</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Estimated timeframe</label>
                    <select id="timeframe" onchange="calculateScores()">
                        <option value="0">Select...</option>
                        <option value="0">Short (≤ half cycle)</option>
                        <option value="-0.5">Medium (up to full cycle)</option>
                        <option value="-2">Long (&gt; full cycle)</option>
                        <option value="-3">Unknown</option>
                    </select>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="crossTech" onchange="calculateScores()">
                        <label for="crossTech"><span class="category-label">[Dependencies]</span> Cross-tech team</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="crossModule" onchange="calculateScores()">
                        <label for="crossModule"><span class="category-label">[Dependencies]</span> Cross-module/app/tech</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="crossProject" onchange="calculateScores()">
                        <label for="crossProject"><span class="category-label">[Dependencies]</span> Cross-project</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="integrations" onchange="calculateScores()">
                        <label for="integrations"><span class="category-label">[Dependencies]</span> Integrations</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="internal3rd" onchange="calculateScores()">
                        <label for="internal3rd"><span class="category-label">[Dependencies]</span> Internal 3rd parties involved</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="external3rd" onchange="calculateScores()">
                        <label for="external3rd"><span class="category-label">[Dependencies]</span> External 3rd parties involved</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="legalSecurity" onchange="calculateScores()">
                        <label for="legalSecurity"><span class="category-label">[Dependencies]</span> Legal / security / pricing implications</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="unknownRisk" onchange="calculateScores()">
                        <label for="unknownRisk">Unknown risk potential</label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scoreIds = ['impactScore', 'confidenceScore', 'easeScore', 'totalScore'];
        const previousScores = {};

        function animateScoreChange(id, newValue) {
            const el = document.getElementById(id);
            if (previousScores[id] !== undefined && previousScores[id] !== newValue) {
                el.classList.remove('pulse');
                el.closest('.score-card').classList.remove('flash');
                void el.offsetWidth; // restart animation
                el.classList.add('pulse');
                el.closest('.score-card').classList.add('flash');
            }
            previousScores[id] = newValue;
            el.textContent = newValue;
        }

        function calculateScores() {
            // Impact calculation (base 0, max 5)
            let impact = 0;
            impact += parseFloat(document.getElementById('winRate').value) || 0;
            impact += parseFloat(document.getElementById('arrPotential').value) || 0;
            impact += parseFloat(document.getElementById('retentionLtv').value) || 0;
            impact += parseFloat(document.getElementById('customerSat').value) || 0;
            impact += parseFloat(document.getElementById('userBaseReach').value) || 0;
            impact = Math.min(Math.round(impact * 10) / 10, 5);

            // Confidence calculation (base 0, max 5)
            let confidence = 0;
            confidence += parseFloat(document.getElementById('cannyVotes').value) || 0;
            confidence += parseFloat(document.getElementById('competitive').value) || 0;
            confidence += document.getElementById('userResearch').checked ? 1 : 0;
            confidence += document.getElementById('analytics').checked ? 0.5 : 0;
            confidence += document.getElementById('differentiator').checked ? 0.5 : 0;
            confidence += document.getElementById('marketTrends').checked ? 0.1 : 0;
            confidence += document.getElementById('icpSegment').checked ? 0.1 : 0;
            confidence += document.getElementById('icpMarket').checked ? 0.25 : 0;
            confidence += document.getElementById('churnedDeals').checked ? 0.75 : 0;
            confidence += document.getElementById('supportWorkload').checked ? 0.5 : 0;
            confidence += document.getElementById('techPerspective').checked ? 1 : 0;
            confidence += document.getElementById('selfConviction').checked ? 0.01 : 0;
            confidence += document.getElementById('managerConviction').checked ? 0.02 : 0;
            confidence += document.getElementById('externalFactors').checked ? 0.5 : 0;
            confidence = Math.min(Math.round(confidence * 10) / 10, 5);

            // Ease calculation (base 5, min 1)
            let ease = 5;
            ease += parseFloat(document.getElementById('complexity').value) || 0;
            ease += parseFloat(document.getElementById('timeframe').value) || 0;
            ease += document.getElementById('crossTech').checked ? -1 : 0;
            ease += document.getElementById('crossModule').checked ? -2 : 0;
            ease += document.getElementById('crossProject').checked ? -1 : 0;
            ease += document.getElementById('integrations').checked ? -2 : 0;
            ease += document.getElementById('internal3rd').checked ? -1 : 0;
            ease += document.getElementById('external3rd').checked ? -2 : 0;
            ease += document.getElementById('legalSecurity').checked ? -1 : 0;
            ease += document.getElementById('unknownRisk').checked ? -1 : 0;
            ease = Math.max(Math.round(ease * 10) / 10, 1);

            // Total score (Impact × Confidence × Ease)
            const total = Math.round(impact * confidence * ease * 10) / 10;

            // Update display, with a pulse animation on any changed score
            animateScoreChange('impactScore', impact);
            animateScoreChange('confidenceScore', confidence);
            animateScoreChange('easeScore', ease);
            animateScoreChange('totalScore', total);
        }

        // Initialize scores on page load
        calculateScores();
    </script>
</body>
</html>
